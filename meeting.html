<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AI Meeting Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cormorant+Garamond:ital,wght@1,600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
    <style>
        :root {
            --red: #ff2a3d;
            --blue: #2a6bff
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #04060b;
            color: #eef2ff;
            font: 16px/1.6 Inter, system-ui, sans-serif
        }

        button,
        input,
        select {
            font: inherit
        }

        :focus-visible {
            outline: 3px solid #ffd24a;
            outline-offset: 2px
        }

        #night,
        #day {
            position: absolute;
            inset: 0;
            transition: opacity 1.6s
        }

        #day {
            opacity: 0;
            pointer-events: none;
            background: #000
        }

        .is-day #day {
            opacity: 1
        }

        .is-day #night {
            opacity: 0;
            pointer-events: none
        }

        /* wall, spotlight, darkness */
        .wall,
        .dk,
        .wr,
        .wb {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 62%
        }

        .wall {
            z-index: 1;
            background: repeating-linear-gradient(0deg, #0000 0 27px, #0008 27px 29px), repeating-linear-gradient(90deg, #0000 0 58px, #0005 58px 60px), linear-gradient(#141b30, #232a43)
        }

        #pool {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 62%;
            z-index: 2
        }

        .sign {
            position: absolute;
            left: 0;
            right: 0;
            top: 9%;
            text-align: center;
            padding: 0 16px;
            z-index: 3
        }

        .t {
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: .05em .3em;
            color: #fff;
            text-shadow: 0 3px 0 #000a;
            font: 400 clamp(20px, 3.4vw, 50px)/1.05 'Archivo Black', sans-serif
        }

        .tag {
            margin: 16px 0 0;
            font: italic 600 clamp(16px, 2.2vw, 28px)/1.2 'Cormorant Garamond', serif;
            color: #ffe9b8;
            text-shadow: 0 2px 8px #000c
        }

        .dk {
            z-index: 4;
            --x: 50%;
            --y: 50%;
            --rx: 1px;
            --ry: 1px;
            background: radial-gradient(ellipse var(--rx) var(--ry) at var(--x) var(--y), #0000 0, #0000 52%, #000000f4 100%);
            transition: opacity 1.8s
        }

        .lit .dk {
            opacity: 0
        }

        .wr,
        .wb {
            z-index: 5;
            mix-blend-mode: screen
        }

        .wr {
            background: radial-gradient(55% 95% at 8% 100%, #ff2a3d77, #0000)
        }

        .wb {
            background: radial-gradient(55% 95% at 92% 100%, #2a6bff77, #0000)
        }

        .wr,
        .lr,
        .rr {
            animation: fa .7s steps(1) infinite
        }

        .wb,
        .lb,
        .rb {
            animation: fb .7s steps(1) infinite
        }

        @keyframes fa {

            0%,
            49% {
                opacity: 1
            }

            50%,
            100% {
                opacity: .06
            }
        }

        @keyframes fb {

            0%,
            49% {
                opacity: .06
            }

            50%,
            100% {
                opacity: 1
            }
        }

        #beam {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 6;
            pointer-events: none;
            mix-blend-mode: screen
        }

        #fix {
            position: absolute;
            left: 50%;
            top: -6px;
            width: 58px;
            height: 36px;
            z-index: 7;
            --o: 0;
            transform: translateX(-50%);
            border-radius: 8px 8px 24px 24px;
            background: #10141c;
            border: 2px solid #3a4258
        }

        #fix i {
            position: absolute;
            bottom: -5px;
            left: 8px;
            right: 8px;
            height: 11px;
            border-radius: 50%;
            background: #fff6d0;
            opacity: var(--o);
            box-shadow: 0 0 26px 12px #fff3bdbb
        }

        /* street */
        .street {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 38%;
            z-index: 1;
            background: linear-gradient(#141a2e, #070a12 70%);
            border-top: 4px solid #2a3150
        }

        .street:before {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg, #ffffff0a 0 2px, #0000 2px 16px)
        }

        .bok {
            position: absolute;
            bottom: 37.5%;
            border-radius: 50%;
            filter: blur(2px);
            z-index: 2
        }

        .rr,
        .rb {
            position: absolute;
            bottom: 3%;
            width: 24vw;
            height: 16%;
            border-radius: 50%;
            filter: blur(8px);
            z-index: 2
        }

        .rr {
            left: 0;
            background: radial-gradient(#ff2a3dbb, #0000 70%)
        }

        .rb {
            left: 14vw;
            background: radial-gradient(#2a6bffbb, #0000 70%)
        }

        .car {
            position: absolute;
            z-index: 8
        }

        .car svg {
            display: block;
            width: 100%;
            height: auto
        }

        .car i {
            position: absolute
        }

        .s .lr,
        .s .lb {
            top: 9%;
            width: 7%;
            height: 10%;
            border-radius: 3px
        }

        .s .lr {
            left: 43%;
            background: var(--red);
            box-shadow: 0 0 30px 16px #ff2a3daa
        }

        .s .lb {
            left: 50.5%;
            background: var(--blue);
            box-shadow: 0 0 30px 16px #2a6bffaa
        }

        .f .lr,
        .f .lb {
            top: 6%;
            width: 15%;
            height: 8%;
            border-radius: 3px
        }

        .f .lr {
            left: 35%;
            background: var(--red);
            box-shadow: 0 0 34px 18px #ff2a3daa
        }

        .f .lb {
            left: 50%;
            background: var(--blue);
            box-shadow: 0 0 34px 18px #2a6bffaa
        }

        .f .hl {
            top: 50%;
            width: 14%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 30px 20px #fffe, 0 0 110px 60px #cfe1ff88
        }

        .f .st {
            top: 88%;
            width: 16%;
            height: 130%;
            background: linear-gradient(#ffffff99, #0000);
            filter: blur(7px)
        }

        .f .hl.a,
        .f .st.a {
            left: 14%
        }

        .f .hl.b,
        .f .st.b {
            left: 72%
        }

        .f .st.a {
            left: 12%
        }

        .f .st.b {
            left: 70%
        }

        /* real street lamps */
        .lamp {
            position: absolute;
            bottom: 30%;
            transform: translateX(-50%);
            height: calc(54vh*var(--s));
            width: calc(18vh*var(--s));
            z-index: 8
        }

        .lamp svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%
        }

        .lt {
            position: absolute;
            inset: 0
        }

        .lt i {
            position: absolute
        }

        .hd {
            left: 68%;
            top: 1%;
            width: 30%;
            height: 3.5%;
            background: #fff0c4;
            border-radius: 4px;
            box-shadow: 0 0 26px 14px #ffd98aaa
        }

        .cn {
            left: 47%;
            top: 5%;
            width: 70%;
            height: 95%;
            background: linear-gradient(#ffe3a07a, #ffe3a000);
            clip-path: polygon(41% 0, 59% 0, 100% 100%, 0 100%);
            mix-blend-mode: screen
        }

        .pl {
            left: 20%;
            bottom: -5%;
            width: 124%;
            height: 11%;
            background: radial-gradient(ellipse, #ffe3a077, #0000 70%)
        }

        .rf {
            left: 79%;
            top: 100%;
            width: 7%;
            height: 50%;
            background: linear-gradient(#ffd98a66, #0000);
            filter: blur(4px)
        }

        .loading .lt {
            animation: fl .62s steps(1) infinite;
            animation-delay: var(--d)
        }

        @keyframes fl {
            0% {
                opacity: 1
            }

            12% {
                opacity: .08
            }

            24% {
                opacity: .9
            }

            40% {
                opacity: .04
            }

            55% {
                opacity: 1
            }

            70% {
                opacity: .2
            }

            85% {
                opacity: .8
            }
        }

        .black .lt,
        .black .wr,
        .black .wb,
        .black .lr,
        .black .lb,
        .black .rr,
        .black .rb,
        .black .hl,
        .black .st,
        .black .bok,
        .black #fix i {
            animation: none;
            opacity: 0
        }

        /* hurdles + form */
        .barr {
            position: absolute;
            bottom: 4%;
            width: clamp(80px, 15vw, 180px);
            height: 42px;
            z-index: 9;
            background: repeating-linear-gradient(135deg, #ffd24a 0 16px, #1a1a1a 16px 32px);
            border: 3px solid #1a1a1a;
            border-radius: 4px
        }

        .barr:before,
        .barr:after {
            content: "";
            position: absolute;
            top: 100%;
            width: 8px;
            height: 24px;
            background: #1a1a1a
        }

        .barr:before {
            left: 12%
        }

        .barr:after {
            right: 12%
        }

        .barr.a {
            left: 2vw
        }

        .barr.b {
            right: 2vw
        }

        .cone {
            position: absolute;
            bottom: 4%;
            width: 0;
            height: 0;
            border: 20px solid #0000;
            border-bottom: 50px solid #ff7a1a;
            border-top: 0;
            z-index: 9
        }

        .cone.a {
            left: calc(2vw + clamp(80px, 15vw, 180px) + 14px)
        }

        .cone.b {
            right: calc(2vw + clamp(80px, 15vw, 180px) + 14px)
        }

        .gate {
            position: absolute;
            left: 50%;
            bottom: 5%;
            transform: translateX(-50%);
            width: min(520px, calc(100vw - 32px));
            z-index: 10;
            display: none
        }

        .gated .gate {
            display: block
        }

        .loading .gate,
        .black .gate {
            display: none
        }

        .tape {
            background: #ffd24a;
            color: #111;
            font: 400 13px/30px 'Archivo Black', sans-serif;
            letter-spacing: .14em;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            transform: rotate(-1.5deg);
            margin: 0 -14px -4px;
            position: relative;
            z-index: 2;
            border-block: 3px solid #111
        }

        .box {
            background: #0a0f1ee8;
            border: 1px solid #ffffff30;
            border-radius: 14px;
            padding: 22px 20px 18px;
            box-shadow: 0 10px 40px #000a
        }

        .box label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            color: #cfd8ff
        }

        .box input[type=url],
        .box select {
            width: 100%;
            height: 46px;
            border-radius: 10px;
            border: 1px solid #ffffff40;
            background: #fff;
            color: #111;
            padding: 0 12px
        }

        .rw {
            display: flex;
            gap: 10px;
            margin: 0 0 12px
        }

        .rw>div {
            flex: 1
        }

        .rw>div.s {
            flex: 0 0 130px
        }

        .up {
            font-size: 14px;
            color: #cfd8ff
        }

        .up button {
            background: none;
            border: 0;
            color: #ffd24a;
            text-decoration: underline;
            cursor: pointer;
            padding: 0
        }

        .go {
            width: 100%;
            height: 48px;
            margin-top: 12px;
            border: 0;
            border-radius: 10px;
            background: var(--red);
            color: #fff;
            font-weight: 600;
            font-size: 17px;
            cursor: pointer
        }

        .err {
            min-height: 22px;
            margin: 8px 0 0;
            color: #ff8f9a;
            font-size: 14px
        }

        #msg {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 12%;
            text-align: center;
            z-index: 10;
            font: 600 clamp(18px, 2.6vw, 26px) Inter;
            color: #fff;
            display: none;
            text-shadow: 0 2px 12px #000
        }

        .loading #msg {
            display: block
        }

        .black #msg {
            display: none
        }

        #msg:after {
            content: "";
            animation: dots 1.2s steps(4) infinite
        }

        @keyframes dots {
            0% {
                content: ""
            }

            25% {
                content: "."
            }

            50% {
                content: ".."
            }

            75% {
                content: "..."
            }
        }

        #dark {
            position: absolute;
            inset: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transition: opacity .15s
        }

        .black #dark {
            opacity: .96
        }

        #flash {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 25
        }

        /* rescue: helicopter, ladders, container of survivors */
        #rescue {
            position: absolute;
            inset: 0;
            z-index: 31;
            pointer-events: none;
            overflow: hidden;
            display: none
        }

        #rescue.on {
            display: block
        }

        #rescue .rot {
            transform-box: fill-box;
            transform-origin: center;
            animation: rot .09s linear infinite
        }

        @keyframes rot {
            50% {
                transform: scaleX(.45)
            }
        }

        .rs-gnd {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 17vh;
            background: linear-gradient(#10172a, #04060b);
            border-top: 3px solid #2a3150
        }

        .rs-pool {
            position: absolute;
            background: radial-gradient(ellipse, #fff3c4aa, #0000 68%);
            opacity: 0;
            transition: opacity 2s
        }

        .rs-heli {
            position: absolute;
            transition: left 2.8s cubic-bezier(.2, .7, .3, 1)
        }

        .rs-heli.out {
            transition: left 2.8s cubic-bezier(.5, 0, .9, .6)
        }

        .rs-heli>svg.rs-hs {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            animation: rsb 1.4s ease-in-out infinite alternate
        }

        @keyframes rsb {
            to {
                transform: translateY(5px)
            }
        }

        .rs-cone {
            position: absolute;
            z-index: 0;
            background: linear-gradient(#fff6d8aa, #fff6d822);
            clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%);
            mix-blend-mode: screen
        }

        .rs-lad {
            position: absolute;
            z-index: 1;
            width: 30px;
            height: 0;
            box-sizing: border-box;
            border-left: 4px solid #d8c08a;
            border-right: 4px solid #d8c08a;
            background: repeating-linear-gradient(#0000 0 15px, #d8c08a 15px 19px);
            overflow: hidden;
            transition: height 1.6s cubic-bezier(.4, 0, .8, .6);
            transform-origin: 50% 0
        }

        .rs-hook {
            position: absolute;
            z-index: 4;
            width: 0;
            height: 0;
            transform-origin: 0 0;
            animation: rsw 2.2s ease-in-out infinite alternate
        }

        @keyframes rsw {
            from {
                transform: rotate(-2.5deg)
            }

            to {
                transform: rotate(2.5deg)
            }
        }

        .rs-cab {
            position: absolute;
            left: -1.5px;
            top: 0;
            width: 3px;
            background: #1a1a1a
        }

        .rs-hook svg {
            position: absolute;
            display: block;
            overflow: visible
        }

        .rs-ppl {
            animation: rsy .45s ease-in-out infinite alternate
        }

        @keyframes rsy {
            to {
                transform: translateY(-4px)
            }
        }

        .rs-heli.out .rs-hook {
            animation: rsw2 .8s ease-in-out infinite alternate
        }

        @keyframes rsw2 {
            from {
                transform: rotate(-9deg)
            }

            to {
                transform: rotate(9deg)
            }
        }

        .rs-heli.out .rs-lad {
            animation: rsl .7s ease-in-out infinite alternate
        }

        @keyframes rsl {
            from {
                transform: rotate(-6deg)
            }

            to {
                transform: rotate(6deg)
            }
        }

        .rs-pl {
            position: absolute;
            z-index: 2
        }

        .rs-pl svg {
            display: block;
            width: 100%;
            height: 100%;
            animation: zsw 1.5s ease-in-out infinite
        }

        .rs-pl.run svg {
            animation: clb .28s ease-in-out infinite alternate
        }

        @keyframes clb {
            from {
                transform: translateY(0) rotate(-3deg)
            }

            to {
                transform: translateY(-6px) rotate(3deg)
            }
        }

        .bub.yay {
            font: 400 26px 'Archivo Black', sans-serif;
            color: #3ECF8E;
            border-color: #3ECF8E;
            text-shadow: 0 0 14px #3ECF8E88;
            letter-spacing: .06em
        }

        /* day */
        .sun {
            position: absolute;
            top: 7vh;
            right: 9vw;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle, #fffbd0, #ffd54a 60%, #ffd54a00 72%)
        }

        .sun:before {
            content: "";
            position: absolute;
            inset: -46px;
            border-radius: 50%;
            background: repeating-conic-gradient(#fff3a066 0 5deg, #0000 5deg 20deg);
            -webkit-mask: radial-gradient(circle, #000 38%, #0000 70%);
            mask: radial-gradient(circle, #000 38%, #0000 70%);
            animation: spin 50s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .cloud {
            position: absolute;
            width: 130px;
            height: 34px;
            border-radius: 34px;
            background: #fff;
            opacity: .9;
            animation: cl 70s linear infinite
        }

        .cloud:before {
            content: "";
            position: absolute;
            left: 24px;
            top: -18px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #fff
        }

        @keyframes cl {
            from {
                transform: translateX(-200px)
            }

            to {
                transform: translateX(calc(100vw + 200px))
            }
        }

        .land {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 36vh
        }

        #out {
            position: absolute;
            inset: 0;
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            padding: 22vh 16px 12vh;
            display: none;
            justify-content: center;
            align-items: flex-start;
            z-index: 5
        }

        .is-day #out {
            display: flex
        }

        .card {
            width: min(780px, 100%);
            background: #fffffff2;
            color: #22303c;
            border-radius: 28px;
            padding: 56px 56px 60px;
            box-shadow: 0 24px 70px #0a3a1f33
        }

        .card h2 {
            font: 400 clamp(28px, 4vw, 40px)/1.2 'Archivo Black', sans-serif;
            color: #18242e;
            margin: 0
        }

        .card h3 {
            font: 600 13px Inter, sans-serif;
            letter-spacing: .14em;
            text-transform: uppercase;
            margin: 0 0 18px
        }

        .card p,
        .card li {
            font-size: 18px;
            line-height: 1.85;
            max-width: none;
            margin: 0
        }

        .card ul {
            margin: 0;
            padding-left: 22px
        }

        .card li {
            margin: 0 0 14px
        }

        .card pre {
            white-space: pre-wrap;
            font: 18px/2 Inter, sans-serif;
            color: #2c3a46;
            margin: 0
        }

        .again {
            margin-top: 44px;
            height: 52px;
            padding: 0 32px;
            border: 0;
            border-radius: 999px;
            background: #ff6b2c;
            color: #fff;
            font: 600 17px Inter, sans-serif;
            cursor: pointer;
            box-shadow: 0 8px 20px #ff6b2c44
        }

        #mute {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 60;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #fff8;
            background: #0008;
            color: #fff;
            cursor: pointer
        }

        @media(max-width:700px) {
            .cone {
                display: none
            }

            .barr {
                height: 32px;
                width: 64px
            }

            .card {
                padding: 22px 20px
            }
        }

        @media(prefers-reduced-motion:reduce) {

            .wr,
            .wb,
            .lr,
            .lb,
            .rr,
            .rb {
                animation-duration: 3s
            }

            .loading .lt {
                animation: none
            }

            .cloud,
            .sun:before {
                animation: none
            }
        }

        #gate {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 10% 85%, #ff2a3d66, transparent 50%), radial-gradient(ellipse at 90% 85%, #2a6bff66, transparent 50%), #04060b
        }

        #begin {
            font: 600 clamp(1.1rem, 2.4vw, 1.5rem) Inter, sans-serif;
            letter-spacing: .04em;
            padding: 20px 46px;
            border-radius: 999px;
            border: 2px solid #fff;
            background: #0009;
            color: #fff;
            cursor: pointer
        }

        #begin:hover,
        #begin:focus-visible {
            background: #fff;
            color: #000
        }

        #count {
            position: fixed;

            from {

            to {
                transform: scale(.88, 1.12) rotate(3deg)
            }

            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;

        }

        .ac.lz {
            filter: drop-shadow(0 0 10px #7dff3a99) drop-shadow(0 0 4px #000)
        }

        .ac.lz svg {
            animation: lzc .35s ease-in-out infinite alternate
        }

        @keyframes lzc {
            to {

        .ac.nm.nf {
            filter: drop-shadow(0 0 16px #ff2a1a) drop-shadow(0 0 44px #ff6a1a99)
        }

            animation-duration: 2.2s
        }

            background: radial-gradient(#fff, #b8ff5a 30%, #2fb34a 55%, #0000 72%)
        }

        .rk.r {
            background: linear-gradient(90deg, #ffb347, #fff);

        }

        .lg {
            filter: drop-shadow(0 0 3px #4ff)
        }

        .las .mf {
            background: radial-gradient(#fff, #6ff 40%, #0000 70%)
        }

            position: fixed;
            height: 5px;
            margin-top: -2.5px;
            transform-origin: 0 50%;
            z-index: 12;
            pointer-events: none;
            border-radius: 3px;
            background: linear-gradient(90deg, #fff, #5ff 25%, #c6f);

            from {
                opacity: 1
            }

            to {
                opacity: 0
            }
        }

            height: 34px;

                transform: scale(1.6);

            }

        }

        }

        }

        }

        #pwbtn.cd {
            cursor: default;

        }

        @keyframes pwp {
            50% {

            }
        }

        }

        .pw {
            position: absolute;
            z-index: 13;
            pointer-events: none
        }

        .pw i {
            display: block;
            position: absolute
        }

        .black .pw {
            display: none
        }

        .card .core {
            margin: 4px 0 16px;
            font-size: 15px;
            line-height: 1.45;
            color: #5a3a2a
        }

        .card .core b {
            color: #e8501a
        }

        #skip {
            position: fixed;
            top: 14px;
            right: 58px;
            z-index: 61;
            display: none;
            height: 28px;
            padding: 0 10px;
            border-radius: 14px;
            border: 1px solid #ffffff55;
            background: #0008;
            color: #fff;
            font: 600 11px Inter, sans-serif;
            cursor: pointer;
            opacity: .75
        }

        #skip:hover {
            opacity: 1
        }

        body.loading #skip {
            display: block
        }

        #skip.nudge {
            opacity: 1;
            border-color: #ffd24a;
            color: #ffd24a;
            animation: skg 1s ease-in-out infinite
        }

        #skip.nudge2 {
            animation-duration: .5s;
            background: #ffd24a;
            color: #111
        }

        @keyframes skg {
            50% {
                box-shadow: 0 0 0 5px #ffd24a55, 0 0 16px 6px #ffd24a
            }
        }

        #chb {
            position: fixed;
            left: 50%;
            bottom: 6%;
            transform: translateX(-50%);
            z-index: 65;
            display: none;
            width: min(440px, calc(100vw - 24px));
            text-align: center;
            background: #0a0f1ef2;
            border: 2px solid #3ecf8e;
            border-radius: 14px;
            padding: 14px 16px;
            color: #fff;
            font: 600 15px/1.4 Inter, sans-serif;
            box-shadow: 0 10px 40px #000a
        }

        #chb.on {
            display: block
        }

        #chb div {
            display: flex;
            gap: 10px;
            margin-top: 10px
        }

        #chb button {
            flex: 1;
            height: 42px;
            border: 0;
            border-radius: 10px;
            font: 600 15px Inter, sans-serif;
            cursor: pointer
        }

        #chb .k {
            background: #3ecf8e;
            color: #06210f
        }

        #chb .e {
            background: #ff2a3d;
            color: #fff
        }

        .ready #msg {
            display: none !important
        }

        .black #skip,
        .is-day #skip,
        .escaping #skip,
        .black #chb,
        .is-day #chb,
        .escaping #chb {
            display: none !important
        }

                q(() => { o.ball && o.ball.remove(); g.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(30px) rotate(8deg)' }, { transform: 'translateX(0)' }], { duration: 350 }); K[kind](o) }, 1900)
            }
            const SH = [['Explosion Flame', 'fire', '#ff5a1a', '#ffd25a'], ['Dragon Crash', 'beast', '#3ddc84', '#ffd24a', 0, '🐲'], ['Death Zone', 'spiral', '#7a2aff', '#111111'], ['Eternal Blizzard', 'ice', '#6cf0ff', '#ffffff'], ['Emperor Penguins', 'flock', '#6ab8ff', '#ffffff', 8, '🐧'], ['Tiger Drive', 'beast', '#ffb020', '#ff5a1a', 0, '🐯'], ['Wolf Legend', 'beast', '#9fb4ff', '#ffffff', 0, '🐺'], ['Lion Blast', 'beast', '#ffd24a', '#ff8a1a', 0, '🦁'], ['Fox Spirit Shot', 'beast', '#ff7ac8', '#ffd2f0', 0, '🦊'], ['Big Bang', 'bigbang', '#ffffff', '#ffd25a'], ['Gigantic Shot', 'giant', '#ff3b2f', '#ffb347'], ['Thunder Drive', 'lightning', '#ffe94a', '#9cc4ff'], ['Sonic Boom Kick', 'sonic', '#bfe3ff', '#ffffff'], ['Hurricane Shot', 'spiral', '#7dffc0', '#2a9a6a'], ['Comet Drop', 'comet', '#ff9a3a', '#fff2a0'], ['Triple Boost', 'multi', '#ff4a4a', '#ffd24a', 3], ['Quintuple Volley', 'multi', '#4aa8ff', '#ffffff', 5], ['Football Rain', 'rain', '#ffffff', '#ffd24a', 14], ['Shadow Strike', 'shadow', '#8a4aff', '#222222'], ['Light Speed Shot', 'beam', '#ffffff', '#9cf0ff'], ['Gravity Shoot', 'gravity', '#b86bff', '#220044'], ['Double Drive', 'multi', '#ff6ad5', '#6af0ff', 2], ['Venom Curve', 'curve', '#7dff3a', '#2a8a1a'], ['Aurora Shot', 'rainbow', '#ff6ad5', '#6af0ff'], ['Magma Impact', 'ground', '#ff5a1a', '#ffcf3a'], ['Typhoon Kick', 'wave', '#2a9aff', '#bfe3ff'], ['Star Fall', 'flock', '#ffe46a', '#fff8c0', 10, '⭐'], ['Ghost Shoot', 'flock', '#c8b0ff', '#ffffff', 7, '👻'], ['Rose Petal Storm', 'flock', '#ff7aa8', '#ffd2e0', 12, '🌸'], ['Blade Kick', 'blade', '#e8f6ff', '#6cf0ff'], ['Armageddon', 'finale', '#ff3b2f', '#ffd25a']];
            const SP = [['Kamehameha', 'kame', '#6cc6ff', '#2a8cff', 0, '', '#111111', '#ff8a1a', '', '', 'Goku'], ['Spirit Bomb', 'sbomb', '#9fd8ff', '#ffffff', 0, '', '#111111', '#ff8a1a', '', '', 'Goku'], ['Kaioken Rush', 'kaio', '#ff3b2f', '#ffffff', 0, '', '#111111', '#ff8a1a', '', '', 'Goku'], ['Final Flash', 'kame', '#ffe94a', '#ff9a1a', 140, '', '#222222', '#2a4bd0', '', '', 'Vegeta'], ['Special Beam Cannon', 'cannon', '#c88bff', '#7a3aff', 0, '', 'none', '#ffffff', '#6fb34a', '', 'Piccolo'], ['Solar Flare', 'solar', '#ffffff', '#ffe46a', 0, '', 'none', '#2a9a4a', '', '', 'Tien'], ['God Hand', 'godhand', '#ffd24a', '#fff2a0', 0, '', '#5a3a22', '#ffd24a', '', '#ff8a1a', 'Endou'], ['Majin The Hand', 'majin', '#a050ff', '#220044', 0, '', '#5a3a22', '#ffd24a', '', '#ff8a1a', 'Endou'], ['Fist of Justice', 'fist', '#ffb020', '#ffffff', 0, '', '#5a3a22', '#ffd24a', '', '#ff8a1a', 'Endou']];
            [...SH, ...SP].forEach(S => POW.push([S[0], 5600, () => shotRun(S)]));

            function gauge(ms, from, to, col, cb, txt) {
                clearInterval(RI); const t0 = performance.now(); btn.style.setProperty('--c', col);
                RI = setInterval(() => { const k = Math.min(1, (performance.now() - t0) / ms); btn.style.setProperty('--p', from + (to - from) * k); if (txt) lab.textContent = txt(Math.ceil((ms / 1000) * (1 - k))); if (k >= 1) { clearInterval(RI); cb && cb() } }, 80)
            }
            function setReady() { ready = true; btn.classList.remove('act', 'cd'); btn.classList.add('rdy'); sym.textContent = '?'; btn.style.setProperty('--p', 100); btn.style.setProperty('--c', '#b86bff'); lab.textContent = 'MYSTERY POWER' }
            function cleanup(fade) {
                T.forEach(t => { clearTimeout(t); clearInterval(t) }); T.length = 0; busy = false; U.splice(0).forEach(f => { try { f() } catch (e) { } });
                const L = E.splice(0); if (fade) { L.forEach(d => { try { d.animate([{ opacity: getComputedStyle(d).opacity }, { opacity: 0 }], { duration: 400, fill: 'forwards' }) } catch (e) { } }); setTimeout(() => L.forEach(d => d.remove()), 420) } else L.forEach(d => d.remove())
            }
            function end() {
                cleanup(true); btn.classList.remove('act'); btn.classList.add('cd'); sym.textContent = '⟳';
                gauge(2000, 0, 100, '#b86bff', () => { if (on) setReady() }, s => 'Reloading ' + s + 's')
            }
            function fire() {
                if (!on || !ready || !BATTLE || !BATTLE.n.isConnected) return;
                if (!bag.length) { bag = POW.map((_, i) => i); for (let r = 0; r < 3; r++)for (let i = POW.length - 9; i < POW.length; i++)bag.push(i); bag.sort(() => Math.random() - .5) }
                const [name, d, f] = POW[bag.pop()]; ready = false; busy = true; btn.classList.remove('rdy'); btn.classList.add('act'); sym.textContent = '!'; lab.textContent = name + '!';
                const n = window.PWUSES = (window.PWUSES || 0) + 1; window.onPower && window.onPower(n);
                ban(name); say(name, .5, .9); powerUp(); flash(1);
                try { f() } catch (e) { console.warn('power failed', e) }
                gauge(d, 100, 0, '#ff5a2a'); T.push(setTimeout(end, d))
            }
            btn.onclick = fire;
            return { show() { if (on) return; on = true; box.classList.add('on'); setReady() }, stop() { on = false; ready = false; clearInterval(RI); cleanup(false); box.classList.remove('on') }, count: POW.length, fire };
        })();
    </script>
    <script>
        function resetInputs() {
            // Clear all text inputs instantly when the page loads or refreshes
            const u = document.getElementById("url");
            if (u) u.value = "";
            // If you have a file input field, clear it too
            const fileInput = document.querySelector('input[type="file"]');
            if (fileInput) fileInput.value = "";
            const fn = document.getElementById("fn");
            if (fn) fn.textContent = "";
        }
        window.onload = resetInputs;
        // also when the browser restores the page from its back/forward cache
        window.addEventListener("pageshow", function (e) { if (e.persisted) resetInputs(); });
    </script>
